<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<style>
  body { width: 288px; margin: 0; padding: 14px; font-family: system-ui, sans-serif; font-size: 14px; color: #111; }
  h1 { font-size: 12px; margin: 0 0 8px; color: #666; letter-spacing: .06em; font-weight: 700; }
  h1:not(:first-child) { margin-top: 18px; }
  .row { display: flex; gap: 8px; align-items: center; padding: 5px 6px; border-radius: 7px; cursor: pointer; }
  .row:hover { background: #f4f4f5; }
  .row input { margin: 0; flex: none; }
  .row .emo { width: 1.5em; text-align: center; flex: none; }
  .card { display: flex; gap: 8px; align-items: flex-start; padding: 8px; border: 1px solid #ddd; border-radius: 8px; margin-bottom: 8px; cursor: pointer; }
  .card:hover { background: #f6f6f6; }
  .desc { font-size: 12px; color: #666; }
  .hint { font-size: 11px; color: #888; margin-top: 10px; line-height: 1.5; }
  .deep { border: 1px solid #d4d4d8; border-radius: 8px; padding: 6px 10px 10px; background: #fafafa; }
  .warn { font-size: 11px; color: #b45309; line-height: 1.5; margin-top: 2px; }
  .tester { border: 1px solid #d4d4d8; border-radius: 8px; padding: 10px; background: #fafafa; }
  .tester input { width: 100%; box-sizing: border-box; font-size: 12px; padding: 6px 8px; border: 1px solid #ccc; border-radius: 6px; font-family: ui-monospace, monospace; }
  .tester button { margin-top: 6px; width: 100%; padding: 6px; font-size: 13px; border: 1px solid #999; border-radius: 6px; background: #fff; cursor: pointer; }
  .tester button:hover { background: #f0f0f0; }
  .out { margin-top: 8px; font-size: 12px; line-height: 1.7; min-height: 1em; word-break: break-all; }
  .out .b { display: inline-block; background: #111; color: #fff; border-radius: 999px; padding: 2px 8px; margin: 2px 3px 2px 0; font-size: 11px; font-weight: 700; }
  .out .none { color: #16a34a; }
  .out .why { color: #666; font-size: 11px; }
  .presets { margin-top: 8px; display: flex; flex-wrap: wrap; gap: 4px; }
  .presets button { width: auto; margin: 0; padding: 3px 8px; font-size: 11px; border-radius: 999px; }
  .userlist { border: 1px solid #d4d4d8; border-radius: 8px; padding: 10px; background: #fafafa; }
  .userlist input { width: 100%; box-sizing: border-box; font-size: 12px; padding: 6px 8px; border: 1px solid #ccc; border-radius: 6px; font-family: ui-monospace, monospace; }
  .btnrow { display: flex; gap: 6px; margin-top: 6px; }
  .btnrow button { flex: 1; padding: 6px 4px; font-size: 12px; border: 1px solid #999; border-radius: 6px; background: #fff; cursor: pointer; }
  .btnrow button:hover { background: #f0f0f0; }
  .sub { font-size: 11px; color: #666; margin-top: 10px; font-weight: 700; }
  .chips { display: flex; flex-wrap: wrap; gap: 4px; margin-top: 4px; }
  .chips .empty { font-size: 11px; color: #999; }
  .chip { display: inline-flex; align-items: center; gap: 4px; font-size: 11px; background: #fff; border: 1px solid #ccc; border-radius: 999px; padding: 2px 4px 2px 8px; word-break: break-all; }
  .chip button { border: none; background: #eee; color: #555; border-radius: 999px; width: 16px; height: 16px; line-height: 1; font-size: 11px; padding: 0; cursor: pointer; flex: none; }
  .chip button:hover { background: #dc2626; color: #fff; }
</style>
</head>
<body>
  <h1>判定するカテゴリ</h1>
  <div id="cats"></div>

  <h1>リンク先の取得</h1>
  <div class="deep">
    <label class="row" style="padding-left:0">
      <input type="checkbox" id="deepScan">
      <span><b>リンク先を取得して判定する</b><br>
      <span class="desc">有料 / 広告過多 / 登録必須 / 短縮の行き先</span></span>
    </label>
    <div class="warn">
      画面に出たリンクの中身を背景で取得します。開発者のサーバーへは何も送信しません。<br>
      ただし<b>クリックしなくても取得する</b>ため、リンク先のサイトにはあなたのIPアドレスが渡ります。気になる場合はOFFにしてください（上記4つは判定できなくなります）。
    </div>
  </div>

  <h1>自分で登録したドメイン</h1>
  <div class="userlist">
    <input id="userDomain" type="text" placeholder="ドメイン または URL を貼る" spellcheck="false">
    <div class="btnrow">
      <button id="addCaution">⚠️ 注意に追加</button>
      <button id="addExclude">判定から除外</button>
    </div>
    <div id="userErr" class="warn"></div>
    <div class="sub">⚠️ 注意（画像を覆います）</div>
    <div id="listCaution" class="chips"></div>
    <div class="sub">判定から除外（何も出しません）</div>
    <div id="listExclude" class="chips"></div>
  </div>

  <h1>動作テスト</h1>
  <div class="tester">
    <input id="testUrl" type="text" placeholder="URLを貼って判定を確認" spellcheck="false">
    <button id="testBtn">判定</button>
    <div id="testOut" class="out"></div>
    <div class="presets" id="presets"></div>
    <button id="clearCache" style="margin-top:8px">判定キャッシュを消す</button>
  </div>

  <div class="hint">変更後、Xのタブを再読み込みすると反映されます。</div>

<script type="module" src="popup.js"></script>
</body>
</html>
